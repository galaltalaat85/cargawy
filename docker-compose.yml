# Local/VPS stack: PostgreSQL + CarGawy. For production prefer managed backups (see docs/BACKUP.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargawy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: cargawy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargawy"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://cargawy:${POSTGRES_PASSWORD:-change-me}@db:5432/cargawy?schema=public
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cargawy:${POSTGRES_PASSWORD:-change-me}@db:5432/cargawy?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage # only used with STORAGE_DRIVER=local
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
